---
name: Build - Android

on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - '.idea/**'
      - '.gitattributes'
      - '.github/**.json'
      - '.gitignore'
      - '.gitmodules'
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'

permissions:
  contents: read

env:
  CI_CHECK_RELEASE_BUILDS: 'false'

concurrency:
  group: android-ci-${{ github.ref }}-${{ github.event.pull_request.number || 'no-pr' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-common:
    name: Build - Common code
    # Run this job only when it would contribute to the cache
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Show disk usage
        uses: ./.github/actions/disk-usage

      - name: Cleanup disk
        uses: ./.github/actions/disk-cleanup

      - name: Setup Gradle environment
        id: setup-gradle
        uses: ./.github/actions/setup-gradle

      - name: Prime configuration and dependency cache
        run: ./gradlew --no-daemon help

      - name: Assemble common
        run: ./gradlew :app-common:assemble

      - name: Show disk usage
        uses: ./.github/actions/disk-usage

      - name: Prepare Gradle cache
        run: |
          ./gradlew --stop || true
          find ~/.gradle/caches -name '*.lock' -type f -delete || true

      - name: Save Gradle cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.setup-gradle.outputs.cache-primary-key }}

  build-k9:
    name: Build - K9 application
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Gradle environment
        uses: ./.github/actions/setup-gradle

      - name: Build K9 application and check badging
        run: |
          ./gradlew :app-k9mail:assemble \
                    :app-k9mail:checkFossReleaseBadging \
                    :app-k9mail:checkFullReleaseBadging \
                    -Pminify=false \
                    --continue

      - name: Check K9 R8 minification
        run: ./gradlew :app-k9mail:minifyFossReleaseWithR8

  build-thunderbird:
    name: Build - Thunderbird application
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Gradle environment
        uses: ./.github/actions/setup-gradle

      - name: Build Thunderbird application and check badging
        run: |
          ./gradlew :app-thunderbird:assemble \
                    :app-thunderbird:checkFossBetaBadging \
                    :app-thunderbird:checkFossDailyBadging \
                    :app-thunderbird:checkFossReleaseBadging \
                    :app-thunderbird:checkFullBetaBadging \
                    :app-thunderbird:checkFullDailyBadging \
                    :app-thunderbird:checkFullReleaseBadging \
                    -Pminify=false \
                    --continue

      - name: Check Thunderbird R8 minification
        run: ./gradlew :app-thunderbird:minifyFossReleaseWithR8

  build-ui-catalog:
    name: Build - UI-catalog application
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Gradle environment
        uses: ./.github/actions/setup-gradle

      - name: Build App UI-catalog application in Debug mode
        run: ./gradlew -p components :ui:catalog:assembleDebug

  quality-unit-test:
    name: Quality - Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Gradle environment
        uses: ./.github/actions/setup-gradle

      - name: Running unit tests
        run: ./gradlew testsOnCi --parallel

  quality-lint:
    name: Quality - Lint
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Gradle environment
        uses: ./.github/actions/setup-gradle

      - name: Running Android lint
        run: ./gradlew lint
