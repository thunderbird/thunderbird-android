---
name: Quality - Checks

on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - '.idea/**'
      - '.gitattributes'
      - '.github/**.json'
      - '.gitignore'
      - '.gitmodules'
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'

concurrency:
  group: quality-checks-${{ github.ref }}-${{ github.event.pull_request.number || 'no-pr' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  quality-static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Gradle environment
        uses: ./.github/actions/setup-gradle

      - name: Quality - Spotless
        run: ./gradlew spotlessCheck

      - name: Quality - Detekt
        if: ${{ !cancelled() }}
        run: ./gradlew detekt

      - name: Quality - Konsist
        if: ${{ !cancelled() }}
        run: ./gradlew :quality:konsist:test

      - name: Quality - Dependency guard
        if: ${{ !cancelled() }}
        run: ./gradlew dependencyGuard

  quality-detekt-type-resolution:
    name: Detekt check (type resolution)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Gradle environment
        uses: ./.github/actions/setup-gradle

      - name: Quality - Detekt with type resolution
        # The type-resolved tasks use config/detekt/detekt-type-resolution.yml, see DetektPlugin
        run: ./gradlew detektAll --continue
